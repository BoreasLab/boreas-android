# The pinned Boreas core release.
#
# An exact tag, never "latest": api/artifacts.md asks for a pin so that the build
# is reproducible and an ABI change is something adopted rather than something
# that happens to you. The digest is the one published in the release's SHA256SUMS
# and is checked on every fetch; CI additionally checks build provenance, which is
# the stronger claim -- a digest only proves the file matches a list that came from
# the same place the file did.
#
# abiVersion is the number the app compiles against and compares, at load, with
# what boreas_abi_version() reports. It is recorded here rather than read from the
# header at configuration time because on a clean checkout there is no header yet
# -- but the header stays the authority: fetchBoreasCore reads BOREAS_ABI_VERSION
# out of the archive and fails if the two disagree, so this line cannot drift.
#
# Updating: change tag, archive, and sha256 together and re-run
#   ./gradlew :app:fetchBoreasCore
# which will tell you if abiVersion also needs to move. An ABI bump is something
# to adopt deliberately; see api/stability.md for what one is allowed to mean.
tag=v0.0.1-dev.2026-08-30.18-00-50.g98e3f4b
archive=boreas-0.0.1-android.tar.gz
sha256=bfc51d6e0c2cb305f2083d6dc6c992d4295f5df13c2ecd78e5f3ae63e7935800
abiVersion=1
