# Continuous integration for the Android control surface.
#
# Four effect domains, so four jobs, and no `needs:` edge between any of them.
# None consumes another's output, and running them all means one push reports
# four results instead of hiding the rest behind the first.
#
#   gate       Properties of the source that no test inside the program can
#              see: punctuation, one source of truth per scale, one icon
#              family, no catch-all over a sealed hierarchy. Needs no
#              toolchain, so it answers while the build is still provisioning.
#
#   build      The laws that hold without a device, then the artifact. :domain
#              carries no Android type, so its lifecycle state machine, its
#              parsing boundary, and the palette's contrast floor all run on a
#              plain JVM. Also the boundary check: an Android import creeping
#              into :domain fails here, because the module has no Android
#              classpath to resolve it against.
#
#   device     What no JVM test can see. An Android .so links bionic and will
#              not open on the host at any price, so the C boundary, consent,
#              and descriptor ownership are only observable on a device. Gradle
#              owns the emulator: see app/build.gradle.kts, testOptions.
#
#   workflows  The workflows themselves, which are code that runs with the
#              repository checked out.
#
# `device` answers most of docs/platform-integration.md. What is left there needs
# a second transport or a real path MTU, and stays hardware's to answer.
#
# Every action here is GitHub's own, at a major tag: see .github/zizmor.yml for
# why that is the policy for actions/* and a hash for everyone else. No
# third-party action appears at all. Where an outside tool is needed it is
# fetched by exact version and checked against a digest, which is a stronger
# guarantee than pinning an action that could do anything once it runs.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Called by release.yml, which must not trust this workflow to have finished
  # on its own: the two are independent workflows racing on the same push, and a
  # red main must not publish. Calling rather than copying keeps one definition
  # of "green" that cannot drift from the one a pull request sees.
  workflow_call:

# No ambient capability. Each job asks for exactly what it needs, and none of
# them needs more than read.
permissions: {}

concurrency:
  # `github.workflow` is the *calling* workflow's name, so a run invoked by
  # release.yml lands in its own group. Sharing one would make the release gate
  # queue behind the CI run of the very push it is gating.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Only the newest run of a branch under review is interesting; a push to the
  # default branch is a record and is allowed to finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: Design gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # The job reads the tree and writes nothing back, so it has no use
          # for a credential in the local git config.
          persist-credentials: false
          submodules: false

      - name: Assert design properties
        shell: bash
        run: ./.github/scripts/design-gate.sh

  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # The wrapper jar is executable code in the repository and the build runs
      # it with this job's privileges. Verified against the checksum Gradle
      # publishes for the version the properties file declares.
      - name: Verify the Gradle wrapper
        shell: bash
        run: ./.github/scripts/gradle-wrapper.sh

      # The key names exactly what invalidates the cache: the declared
      # dependency versions and the wrapper. restore-keys allows a stale hit
      # from the same wrapper, which is a warm start rather than a wrong one.
      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/boreas-core
          key: >-
            gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties',
            'gradle/libs.versions.toml', 'gradle/boreas-core.properties', '**/*.gradle.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install the Android SDK packages this build compiles against
        shell: bash
        run: ./.github/scripts/android-sdk.sh 'platforms;android-37.0' 'build-tools;37.0.0'

      # The core is a binary fetched on every build, which is a supply-chain edge
      # the digest alone does not close: a checksum only proves the file matches a
      # list that came from the same place the file did. This proves which
      # workflow built it, from which commit, before anything unpacks it. It fills
      # the same cache the Gradle task reads, so the build does not fetch again.
      - name: Verify the pinned Boreas core
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/scripts/boreas-core.sh

      # The release tag algebra and the versionCode packing, whose laws are the
      # reason none of either lives in a workflow file. An included build, so it
      # is asked for by directory rather than by task path.
      - name: Test the version algebra
        shell: bash
        run: ./gradlew --no-daemon -p build-logic test

      - name: Test
        shell: bash
        run: ./gradlew --no-daemon :domain:test :app:testDebugUnitTest

      # Before lint, deliberately. Lint is configured to fail on warnings, so
      # running it first would stop the job and leave the question of whether the
      # artifact even builds unanswered for another round trip. Assembly is the
      # more expensive fact to learn, so it is learned first.
      - name: Build the artifact
        shell: bash
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease

      # Runs even when assembly failed. The two answer different questions, and a
      # run that reports only the first of them costs a whole round trip to learn
      # the second.
      - name: Lint both modules
        if: ${{ !cancelled() }}
        shell: bash
        run: ./gradlew --no-daemon :app:lintDebug :domain:lint

      # AGP 9 always writes the reports and has deprecated the switches that used
      # to aim them at stdout, so the text report is read back from disk. The whole
      # file, because a truncated finding list costs another push to complete.
      - name: Print the lint reports
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          found=0
          while IFS= read -r report; do
            found=1
            printf '\n===== %s =====\n' "$report"
            cat -- "$report"
          done < <(find app/build domain/build -name 'lint-results*.txt' -type f 2>/dev/null)
          if ((found == 0)); then
            printf 'no lint text report was written\n'
          fi

      # Unsigned, and built from a dependency set no release gate has admitted.
      # This is a build output for inspection, not a release candidate, and the
      # retention window says so.
      - name: Upload unsigned APKs
        uses: actions/upload-artifact@v7
        with:
          name: boreas-android-unsigned
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7

      # Reports are most useful exactly when the steps above failed.
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            domain/build/reports/tests/**
            domain/build/test-results/**
            app/build/reports/lint-results-*.html
            domain/build/reports/lint-results*.html
          if-no-files-found: ignore
          retention-days: 7

  device:
    name: Device (${{ matrix.device }}, ${{ matrix.variant }})
    runs-on: ubuntu-latest
    # Two thirds of this is one cold system-image download and boot. The tests
    # themselves take about a minute.
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      # One cell's verdict never stands in for the other's.
      fail-fast: false
      matrix:
        # The diagonal of {API level} x {build type}, not the product. 29 is the
        # floor and where the platform differs most; release is what ships and
        # the only build R8 has touched. The other two cells would boot two more
        # emulators to re-answer what these already answer.
        include:
          - device: api29
            variant: debug
          - device: api36
            variant: release
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify the Gradle wrapper
        shell: bash
        run: ./.github/scripts/gradle-wrapper.sh

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/boreas-core
          key: >-
            gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties',
            'gradle/libs.versions.toml', 'gradle/boreas-core.properties', '**/*.gradle.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # `emulator` and `platform-tools` beyond what `build` needs. The system
      # image is left to Gradle, which knows which one each device resolves to;
      # naming it here would be a second place for that to be wrong.
      - name: Install the Android SDK packages this build compiles against
        shell: bash
        run: >-
          ./.github/scripts/android-sdk.sh 'platforms;android-37.0' 'build-tools;37.0.0'
          'platform-tools' 'emulator'

      - name: Make /dev/kvm writable
        shell: bash
        run: ./.github/scripts/kvm.sh

      - name: Verify the pinned Boreas core
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/scripts/boreas-core.sh

      # Only the release cell needs one, and it needs one that is not the release
      # key: this job holds no secret, so a fork's pull request runs it too.
      - name: Make a throwaway signing key
        if: ${{ matrix.variant == 'release' }}
        shell: bash
        run: ./.github/scripts/ephemeral-key.sh

      # Gradle downloads the image, boots it, installs both APKs, runs, and tears
      # the device down. The matrix values arrive as data rather than as a splice.
      - name: Run the device suite
        shell: bash
        env:
          DEVICE: ${{ matrix.device }}
          VARIANT: ${{ matrix.variant }}
        run: |
          ./gradlew --no-daemon -Pboreas.testBuildType="$VARIANT" "$DEVICE${VARIANT^}AndroidTest"

      # A minified test APK can lose every test to R8 and still report success.
      - name: Assert the suite ran
        shell: bash
        run: ./.github/scripts/device-ran.sh app/build/outputs/androidTest-results

      # No APK leaves this job. The release one carries a signature that is not
      # ours, and an installable artefact signed by a throwaway key is worse than
      # no artefact at all.
      - name: Upload the device reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: device-${{ matrix.device }}-${{ matrix.variant }}
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: ignore
          retention-days: 7

  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: false

      # Fetched by exact version and verified against a checksum recorded here,
      # so this step cannot be changed by anything happening upstream. It also
      # ShellChecks the run: blocks above and the scripts they call.
      - name: Run actionlint
        shell: bash
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: ./.github/scripts/actionlint.sh

      - name: ShellCheck the scripts
        shell: bash
        run: shellcheck --severity=style .github/scripts/*.sh

      # zizmor reads workflows for the failure modes actionlint does not model:
      # excessive permissions, unpinned actions, credential persistence, and
      # untrusted interpolation into a shell.
      - name: Run zizmor
        shell: bash
        env:
          ZIZMOR_VERSION: 1.29.0
        run: ./.github/scripts/zizmor.sh
