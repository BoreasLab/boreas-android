# The fallback version, and visibly a placeholder rather than a claim.
#
# The tag is the version. This field exists because Gradle wants one and because
# a developer with no tags and no network should still build something coherent;
# it is never an input to the release algebra. CI injects the resolved tag as
# -Pboreas.versionName and the computed integer as -Pboreas.versionCode, and
# neither is committed: one contains a timestamp and the other a commit count,
# and both only exist at build time.
version=0.0.0

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
